<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자유게시판 · LOGIC 동아리</title>
<script src="../js/board.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/board.css">
</head>
<body>

<!-- top nav -->
<div class="nav">
  <a class="logo" href="home.html">
    <span>L</span><span>O</span><span>G</span><span>I</span><span>C</span>
  </a>
  <div class="tabs">
    <a class="tab-btn" href="home.html">홈</a>
    <a class="tab-btn" href="dashboard.html">소개</a>
    <a class="tab-btn" href="schedule.html">일정</a>
    <a class="tab-btn" href="gallery.html">갤러리</a>
    <a class="tab-btn" href="notice.html">공지사항</a>
    <a class="tab-btn active" href="board.html">자유게시판</a>
    <a class="tab-btn" href="dashboard.html">문의</a>
  </div>
  <div class="nav-right">
    <span class="greeting">안녕하세요, <b>지민</b>님</span>
    <button class="icon-btn" title="알림" onclick="alert('새 알림이 없습니다.')">🔔</button>
    <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
  </div>
</div>

<main class="content">
<!-- ============ BOARD (자유게시판) ============ -->
<section class="page">
  <h2>자유게시판</h2>
  <p class="lede">부원들과 자유롭게 이야기를 나눠보세요.</p>

  <div class="board-toolbar">
    <span class="board-count" id="boardCount">전체 0개의 글</span>
    <button class="write-btn" onclick="toggleWriteForm()">✍️ 글쓰기</button>
  </div>

  <div class="write-form" id="writeForm">
    <div class="form-row">
      <input type="text" id="postName" placeholder="이름">
      <input type="text" id="postTitle" placeholder="제목">
    </div>
    <textarea id="postContent" placeholder="내용을 입력하세요"></textarea>
    <div class="form-actions">
      <button class="btn-ghost" onclick="toggleWriteForm(false)">취소</button>
      <button class="btn-primary" onclick="submitPost()">등록</button>
    </div>
  </div>

  <div id="postList"></div>
</section>
</main>

<!-- footer -->
<div class="footer">
  <div class="footer-note">LOGIC 동아리 · 함께 생각하는 즐거움</div>
</div>
</body>
</html>
